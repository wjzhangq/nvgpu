name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Tidy
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vet (no_nvml)
        run: go vet -tags no_nvml ./...

      - name: Test (no_nvml)
        run: go test -tags no_nvml ./...

      - name: Build matrix
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          # 交叉编译产物走 no_nvml（纯 Go，无 CGO），GPU 采集使用 nvidia-smi
          # GB10 / Grace 是 arm64，必须带上
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -tags no_nvml -ldflags "$LDFLAGS" -o dist/nvgpu-linux-amd64
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -tags no_nvml -ldflags "$LDFLAGS" -o dist/nvgpu-linux-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags no_nvml -ldflags "$LDFLAGS" -o dist/nvgpu-windows-amd64.exe
          # 本机 NVML 构建（需要 CGO），GPU 采集快 4-5 倍
          CGO_ENABLED=1 GOOS=linux   GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/nvgpu-linux-amd64-nvml

      - uses: actions/upload-artifact@v4
        with:
          name: nvgpu-binaries
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
