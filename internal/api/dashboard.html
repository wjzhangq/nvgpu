<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-0: #05070C;
  --bg-1: #0A0D12;
  --bg-2: #0F131C;
  --bg-3: #161D2B;
  --bg-4: #1E2636;
  --accent: #38BDF8;
  --accent-warm: #6EE7B7;
  --text: #E5E7EB;
  --text-dim: #9CA3AF;
  --success: #10B981;
  --warning: #F59E0B;
  --error: #EF4444;
  --low: #10B981;
  --medium: #F59E0B;
  --high: #EF4444;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg-2);
  color: var(--text);
  padding: clamp(1rem, 3vw, 1.5rem);
  line-height: 1.5;
}
.header {
  margin-bottom: 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}
.header h1 {
  font-size: clamp(1.25rem, 4vw, 1.5rem);
  font-weight: 600;
  letter-spacing: -0.02em;
}
.refresh-time {
  font-size: 0.875rem;
  color: var(--text-dim);
}
.nodes {
  display: grid;
  gap: 1rem;
  grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
}
.node-card {
  background: var(--bg-3);
  border-radius: 12px;
  padding: 1.5rem;
  border: 1px solid var(--bg-4);
}
.node-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--bg-4);
  gap: 1rem;
}
.node-title {
  font-weight: 600;
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
}
.node-hostname {
  font-size: 0.875rem;
  color: var(--text-dim);
  margin-top: 0.25rem;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--success);
  flex-shrink: 0;
}
.status-dot.offline { background: var(--error); }
.metric {
  margin-bottom: 1.25rem;
  padding-bottom: 1.25rem;
  border-bottom: 1px solid var(--bg-4);
}
.metric:last-child {
  margin-bottom: 0;
  padding-bottom: 0;
  border-bottom: none;
}
.metric-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 0.5rem;
}
.metric-label {
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.metric-sub {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
  margin-top: 0.125rem;
}
.metric-readout {
  font-size: 1.75rem;
  font-weight: 650;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  flex-shrink: 0;
}
.metric-readout .unit {
  font-size: 0.9375rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-left: 0.125rem;
}
.metric-readout.dim {
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-dim);
}
.dim {
  color: var(--text-dim);
  font-weight: 400;
}
.metric-bar {
  background: var(--bg-1);
  height: 6px;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 0.5rem;
}
.metric-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.3s ease, background-color 0.3s ease;
}
.lvl-low { color: var(--low); }
.lvl-medium { color: var(--medium); }
.lvl-high { color: var(--high); }
.fill-low { background: var(--low); }
.fill-medium { background: var(--medium); }
.fill-high { background: var(--high); }
.error-msg, .empty-msg, .metric-missing {
  color: var(--error);
  font-size: 0.875rem;
  padding: 0.75rem;
  background: rgba(239, 68, 68, 0.1);
  border-radius: 8px;
}
.empty-msg {
  color: var(--text-dim);
  background: var(--bg-3);
  text-align: center;
  padding: 2rem;
  border: 1px solid var(--bg-4);
}
.metric-missing {
  color: var(--text-dim);
  background: var(--bg-2);
  padding: 0.5rem 0.75rem;
  margin-top: 0.375rem;
}
.metric-value.dim {
  color: var(--text-dim);
}
.history-chart {
  margin-top: 0.75rem;
  height: 120px;
  background: var(--bg-1);
  border-radius: 8px;
  padding: 8px;
  border: 1px solid var(--bg-4);
}
.history-chart canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div class="header">
  <h1>GPU Monitor</h1>
  <div class="refresh-time" id="refresh-time">加载中...</div>
</div>
<div class="nodes" id="nodes"></div>

<script>
let lastUpdate = null;
let historyCache = null;

async function fetchData() {
  try {
    const [metricsResp, historyResp] = await Promise.all([
      fetch('/api/v1/metrics'),
      fetch('/api/v1/history')
    ]);
    const metrics = await metricsResp.json();
    historyCache = await historyResp.json();
    lastUpdate = new Date();
    renderNodes(metrics?.nodes || []);
    updateRefreshTime();
  } catch (err) {
    document.getElementById('refresh-time').textContent = '连接失败';
    document.getElementById('nodes').innerHTML = `
      <div class="error-msg">无法连接到服务器，请检查服务是否正常运行</div>
    `;
    console.error(err);
  }
}

function extractHistory(nodeName, type, index) {
  if (!historyCache?.nodes) return [];
  const nodeHistory = historyCache.nodes.find(n => n.node === nodeName);
  if (!nodeHistory?.samples) return [];

  return nodeHistory.samples.map(sample => {
    if (!sample.online) return null;
    if (type === 'cpu' && sample.cpus?.[index]) {
      return sample.cpus[index].usage_percent;
    }
    if (type === 'gpu' && sample.gpus?.[index]) {
      return sample.gpus[index].utilization_percent;
    }
    return null;
  }).filter(v => v !== null);
}

function drawChart(canvas, values, baseColor) {
  if (!values.length) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0) return;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const max = 100;
  const count = Math.min(60, values.length);
  const recent = values.slice(-count);
  const stepX = w / (count - 1 || 1);

  // Determine average for color
  const avg = recent.reduce((a, b) => a + b, 0) / recent.length;
  let color = '#10B981'; // green
  if (avg >= 80) color = '#EF4444'; // red
  else if (avg >= 60) color = '#F59E0B'; // yellow

  // Draw area fill
  ctx.beginPath();
  ctx.moveTo(0, h);
  recent.forEach((v, i) => {
    const x = i * stepX;
    const y = h - (v / max) * h;
    if (i === 0) ctx.lineTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(w, h);
  ctx.closePath();

  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, color + '40');
  gradient.addColorStop(1, color + '08');
  ctx.fillStyle = gradient;
  ctx.fill();

  // Draw line
  ctx.beginPath();
  recent.forEach((v, i) => {
    const x = i * stepX;
    const y = h - (v / max) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  // Draw subtle grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
  ctx.lineWidth = 1;
  [25, 50, 75].forEach(pct => {
    const y = h - (pct / 100) * h;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  });
}

function updateRefreshTime() {
  if (!lastUpdate) return;
  const elapsed = Math.floor((Date.now() - lastUpdate) / 1000);
  document.getElementById('refresh-time').textContent =
    elapsed === 0 ? '刚刚更新' : `${elapsed} 秒前更新`;
}

function renderNodes(nodes) {
  const container = document.getElementById('nodes');

  if (!Array.isArray(nodes) || nodes.length === 0) {
    container.innerHTML = '<div class="empty-msg">暂无节点数据</div>';
    return;
  }

  container.innerHTML = nodes.map((n, nodeIdx) => {
    if (!n || typeof n !== 'object') {
      return '<div class="node-card"><div class="error-msg">节点数据格式异常</div></div>';
    }

    const name = n.node || `节点 ${nodeIdx}`;
    const host = n.host || {};
    const hostLine = [host.hostname, host.arch ? `(${host.arch})` : '']
      .filter(Boolean).join(' ') || '-';

    if (!n.online) {
      return `
        <div class="node-card">
          ${nodeHeaderHtml(name, hostLine, true)}
          <div class="error-msg">${esc(n.error || '离线')}</div>
        </div>
      `;
    }

    const cpus = Array.isArray(n.cpus) ? n.cpus : [];
    const gpus = Array.isArray(n.gpus) ? n.gpus : [];
    const body = [
      cpus.length ? cpus.map((c, i) => cpuHtml(c || {}, i, nodeIdx)).join('') : missingHtml('CPU'),
      memoryHtml(n.memory),
      gpus.length ? gpus.map((g, i) => gpuHtml(g || {}, i, nodeIdx)).join('') : missingHtml('GPU')
    ];

    return `
      <div class="node-card">
        ${nodeHeaderHtml(name, hostLine, false)}
        ${body.join('')}
      </div>
    `;
  }).join('');

  // draw charts after DOM update
  requestAnimationFrame(() => {
    nodes.forEach((n, nodeIdx) => {
      if (!n || !n.online) return;

      const cpus = Array.isArray(n.cpus) ? n.cpus : [];
      const gpus = Array.isArray(n.gpus) ? n.gpus : [];

      cpus.forEach((c, i) => {
        const canvas = document.getElementById(`cpu_${nodeIdx}_${i}`);
        if (canvas) {
          const values = extractHistory(n.node, 'cpu', i);
          drawChart(canvas, values);
        }
      });

      gpus.forEach((g, i) => {
        const canvas = document.getElementById(`gpu_${nodeIdx}_${i}`);
        if (canvas) {
          const values = extractHistory(n.node, 'gpu', i);
          drawChart(canvas, values);
        }
      });
    });
  });
}

function nodeHeaderHtml(name, hostLine, offline) {
  return `
    <div class="node-header">
      <div>
        <div class="node-title">${esc(name)}</div>
        <div class="node-hostname">${esc(hostLine)}</div>
      </div>
      <span class="status-dot${offline ? ' offline' : ''}"></span>
    </div>
  `;
}

function missingHtml(label) {
  return `
    <div class="metric">
      <div class="metric-label">${esc(label)}</div>
      <div class="metric-missing">无 ${esc(label)} 数据</div>
    </div>
  `;
}

function colorLevel(pct) {
  if (pct === null) return 'dim';
  if (pct >= 80) return 'high';
  if (pct >= 60) return 'medium';
  return 'low';
}

function cpuHtml(c, i, nodeIdx) {
  const pct = num(c.usage_percent);
  const level = colorLevel(pct);
  return `
    <div class="metric">
      <div class="metric-head">
        <div>
          <div class="metric-label">
            CPU ${i}
            <div class="metric-sub">${esc(c.model || '未知型号')}</div>
          </div>
        </div>
        <div class="metric-readout lvl-${level}">
          ${pct === null ? '<span class="dim">N/A</span>' : `${pct.toFixed(1)}<span class="unit">%</span>`}
        </div>
      </div>
      ${pct !== null ? `<div class="metric-bar"><div class="metric-fill fill-${level}" style="width: ${pct}%"></div></div>` : ''}
      <div class="history-chart"><canvas id="cpu_${nodeIdx}_${i}"></canvas></div>
    </div>
  `;
}

function memoryHtml(memory) {
  if (!memory || typeof memory !== 'object') return missingHtml('Memory');

  const pct = num(memory.usage_percent);
  const used = num(memory.used_bytes);
  const total = num(memory.total_bytes);
  const level = colorLevel(pct);

  const subtitle = (used !== null && total !== null)
    ? `${gb(used)} / ${gb(total)} GB`
    : '容量未知';

  return `
    <div class="metric">
      <div class="metric-head">
        <div>
          <div class="metric-label">
            Memory${memory.unified ? ' (统一内存)' : ''}
            <div class="metric-sub">${subtitle}</div>
          </div>
        </div>
        <div class="metric-readout lvl-${level}">
          ${pct === null ? '<span class="dim">N/A</span>' : `${pct.toFixed(1)}<span class="unit">%</span>`}
        </div>
      </div>
      ${pct !== null ? `<div class="metric-bar"><div class="metric-fill fill-${level}" style="width: ${pct}%"></div></div>` : ''}
    </div>
  `;
}

function gpuHtml(g, i, nodeIdx) {
  const pct = num(g.utilization_percent);
  const vramUsed = num(g.vram_used_bytes);
  const vramTotal = num(g.vram_total_bytes);
  const temp = num(g.temperature_celsius);
  const power = num(g.power_watts);
  const level = colorLevel(pct);

  const extras = [];
  if (vramUsed !== null && vramTotal !== null) {
    extras.push(`VRAM: ${gb(vramUsed)}/${gb(vramTotal)} GB`);
  }
  if (temp !== null && temp > 0) extras.push(`${temp}°C`);
  if (power !== null && power > 0) extras.push(`${power.toFixed(1)}W`);

  const subtitle = extras.length > 0 ? extras.join(' | ') : '';

  return `
    <div class="metric">
      <div class="metric-head">
        <div>
          <div class="metric-label">
            GPU ${i}
            <div class="metric-sub">${esc(g.model || '未知型号')}${g.unified ? ' (统一内存)' : ''}</div>
          </div>
        </div>
        <div class="metric-readout lvl-${level}">
          ${pct === null ? '<span class="dim">N/A</span>' : `${pct.toFixed(1)}<span class="unit">%</span>`}
        </div>
      </div>
      ${pct !== null ? `<div class="metric-bar"><div class="metric-fill fill-${level}" style="width: ${pct}%"></div></div>` : ''}
      ${subtitle ? `<div class="metric-sub" style="margin-top: 0.5rem">${subtitle}</div>` : ''}
      <div class="history-chart"><canvas id="gpu_${nodeIdx}_${i}"></canvas></div>
    </div>
  `;
}

function num(v) {
  return typeof v === 'number' && Number.isFinite(v) ? v : null;
}

function gb(bytes) {
  const n = num(bytes);
  return n === null ? '-' : (n / 1024 / 1024 / 1024).toFixed(1);
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s == null ? '' : String(s);
  return div.innerHTML;
}

fetchData();
setInterval(fetchData, 5000);
setInterval(updateRefreshTime, 1000);
</script>
</body>
</html>
